<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑪奇M 攻略資料站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     以下是「程式／模板」區：負責版面、外觀、搜尋、切換畫面。
     你平常不用改這裡。真正要改的資料在檔案最下方的 <script> 內。
     =================================================================== */

  :root{
    --bg:#14161d;          /* 整體背景：暗夜靛藍 */
    --panel:#1b1e27;       /* 側邊欄／面板 */
    --panel-2:#22262f;     /* 卡片 */
    --line:#2e333f;        /* 分隔線 */
    --text:#e8e4d8;        /* 主要文字：暖羊皮紙色 */
    --muted:#9a9385;       /* 次要文字 */
    --gold:#d9a441;        /* 主題色：符文金 */
    --gold-soft:rgba(217,164,65,.14);
    /* 稀有度顏色（遊戲慣例，方便一眼分辨） */
    --r-common:#a8adb8;
    --r-rare:#6aa9e6;
    --r-legend:#e8b04b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC",system-ui,sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  a{color:var(--gold);}

  .app{display:flex;min-height:100vh;}

  /* ---------- 左側選單欄 ---------- */
  .sidebar{
    width:248px;flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .brand .title{
    font-family:"Noto Serif TC",serif;
    font-weight:700;font-size:19px;line-height:1.3;
    letter-spacing:.5px;
  }
  .brand .sub{
    font-family:"Cinzel",serif;
    font-size:11px;letter-spacing:2px;
    color:var(--gold);margin-top:4px;text-transform:uppercase;
  }
  nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
  .nav-btn{
    display:flex;align-items:center;gap:11px;
    width:100%;text-align:left;
    background:none;border:none;cursor:pointer;
    color:var(--muted);
    font-family:inherit;font-size:15px;
    padding:11px 13px;border-radius:9px;
    transition:background .15s,color .15s;
  }
  .nav-btn .ico{width:20px;text-align:center;font-size:15px;color:var(--gold);opacity:.75;}
  .nav-btn:hover{background:var(--panel-2);color:var(--text);}
  .nav-btn.active{background:var(--gold-soft);color:var(--text);font-weight:500;}
  .nav-btn.active .ico{opacity:1;}
  .side-foot{margin-top:auto;padding:16px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);}

  /* ---------- 右側內容區 ---------- */
  .content{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:16px 26px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(20,22,29,.9);backdrop-filter:blur(6px);z-index:5;
  }
  .menu-toggle{display:none;background:none;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 11px;cursor:pointer;font-size:16px;}
  .topbar h1{font-family:"Noto Serif TC",serif;font-size:20px;margin:0;font-weight:600;}
  .view{padding:26px;max-width:1100px;}

  /* ---------- 首頁 ---------- */
  .hero{
    border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(135deg,#1d2130,#191b22);
    padding:30px 32px;margin-bottom:26px;position:relative;overflow:hidden;
  }
  .hero::after{content:"ᚱ";position:absolute;right:-10px;top:-30px;font-size:180px;
    color:var(--gold);opacity:.05;font-family:serif;}
  .hero h2{font-family:"Noto Serif TC",serif;font-size:26px;margin:0 0 8px;}
  .hero p{color:var(--muted);margin:0;max-width:560px;}
  .sec-label{font-family:"Cinzel",serif;font-size:12px;letter-spacing:2px;color:var(--gold);
    text-transform:uppercase;margin:0 0 12px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:28px;}
  .info-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .info-card .date{font-size:12px;color:var(--gold);margin-bottom:6px;}
  .info-card h3{margin:0 0 6px;font-size:16px;}
  .info-card p{margin:0;font-size:14px;color:var(--muted);}
  .quick{display:flex;flex-wrap:wrap;gap:10px;}
  .quick button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:.15s;}
  .quick button:hover{border-color:var(--gold);color:var(--gold);}

  /* ---------- 符文：工具列 ---------- */
  .tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
  .search{flex:1;min-width:200px;position:relative;}
  .search input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);font-family:inherit;font-size:15px;
    padding:11px 14px 11px 38px;border-radius:10px;outline:none;transition:border .15s;
  }
  .search input:focus{border-color:var(--gold);}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.15s;}
  .chip:hover{color:var(--text);}
  .chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}

  /* ---------- 符文：圖案牆 ---------- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .rune{
    background:var(--panel-2);border:1px solid var(--line);border-radius:14px;
    padding:18px 12px 14px;text-align:center;cursor:pointer;
    transition:transform .12s,border-color .12s,box-shadow .12s;
  }
  .rune:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.35);}
  .rune .glyph{
    font-size:30px;line-height:1;margin-bottom:12px;                                    /* 44 → 30，字跟著縮 */
    display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;  /* 72 → 48，格子縮 1/3 */
  }
  .rune .rname{font-size:15px;font-weight:500;margin-bottom:6px;}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;}
  .empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1;}

  /* ---------- 符文：詳情頁 ---------- */
  .back{background:none;border:1px solid var(--line);color:var(--text);font-family:inherit;
    font-size:14px;padding:8px 15px;border-radius:9px;cursor:pointer;margin-bottom:20px;transition:.15s;}
  .back:hover{border-color:var(--gold);color:var(--gold);}
  .detail{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;}
  .detail .big-glyph{
    width:180px;height:180px;flex-shrink:0;border-radius:18px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:96px;
  }
  .detail .info{flex:1;min-width:260px;}
  .detail h2{font-family:"Noto Serif TC",serif;font-size:28px;margin:0 0 10px;}
  .detail .field{margin-top:18px;}
  .detail .field .k{font-family:"Cinzel",serif;font-size:11px;letter-spacing:1.5px;
    color:var(--gold);text-transform:uppercase;margin-bottom:5px;}
  .detail .field .v{font-size:16px;line-height:1.7;}

  .placeholder{color:var(--muted);border:1px dashed var(--line);border-radius:14px;
    padding:40px;text-align:center;}
  .placeholder .big{font-size:40px;margin-bottom:12px;opacity:.5;}
  
  /* 生活技能：左右兩欄 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
.col h3{font-family:"Noto Serif TC",serif;font-size:18px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.skill-list{display:flex;flex-direction:column;gap:8px;}
.skill-item{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 15px;cursor:pointer;transition:.15s;font-size:15px;}
.skill-item:hover{border-color:var(--gold);color:var(--gold);}
@media(max-width:820px){ .two-col{grid-template-columns:1fr;} }

  /* 道具標籤（小藥丸） */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;
     background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);}
.tag.missing{background:none;border-color:#c0504d;color:#c0504d;}  /* 代號查不到時的警示樣式 */
/* 道具小卡：把技能底下的道具做成一張卡 */
.item-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
           padding:12px 15px;cursor:pointer;transition:.15s;text-align:left;width:100%;
           font-family:inherit;color:var(--text);}
.item-card:hover{border-color:var(--gold);}
.item-card .iname{font-size:15px;font-weight:500;margin-bottom:2px;}
.item-card .idesc{font-size:13px;color:var(--muted);margin-top:6px;}

  /* ---------- 手機版 ---------- */
  .backdrop{display:none;}
  @media(max-width:820px){
    .sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);
      transition:transform .22s;box-shadow:2px 0 20px rgba(0,0,0,.5);}
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{display:block;}
    .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;}
    .view{padding:18px;}
    .detail .big-glyph{width:130px;height:130px;font-size:70px;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app">

  <!-- 左側選單欄 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="title">瑪奇M 攻略資料站</div>
      <div class="sub">Mabinogi&nbsp;M</div>
    </div>
    <nav id="nav">
      <button class="nav-btn active" data-view="home"><span class="ico">⌂</span>首頁</button>
      <button class="nav-btn" data-view=""><span class="ico">📢</span>官方公告</button>
      <button class="nav-btn" data-view="npc"><span class="ico">🧝</span>NPC介紹</button>
      <button class="nav-btn" data-view="job"><span class="ico">⚔️</span>職業介紹</button>
      <button class="nav-btn" data-view="life"><span class="ico">⛏️</span>生活技能</button>
      <button class="nav-btn" data-view=""><span class="ico">🛡️</span>裝備查詢</button>
      <button class="nav-btn" data-view=""><span class="ico">🎒</span>物品查詢</button>
      <button class="nav-btn" data-view="rune"><span class="ico">ᚱ</span>符文查詢</button>
      <button class="nav-btn" data-view="guide"><span class="ico">📖</span>攻略專區</button>
      
    </nav>
    <div class="side-foot">建置中 · 資料持續更新</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- 右側內容區 -->
  <div class="content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h1 id="pageTitle">首頁</h1>
    </div>
    <div class="view" id="view"></div>
  </div>

</div>

<script src="data/data-common.js"></script>
<script src="data/data-runes.js"></script>
<script src="data/data-items.js"></script>
<script src="data/data-npcs.js"></script>
<script src="data/data-jobs.js"></script>
<script src="data/data-life.js"></script>
<script>
  


  
/* ===================================================================
   ↓↓↓ 以下是「程式／模板」，負責把上面的資料變成畫面。平常不用改。 ↓↓↓
   =================================================================== */

const view = document.getElementById('view');
const pageTitle = document.getElementById('pageTitle');
let runeCats = [];      // 已選種類（空陣列＝全部）
let runeGrades = [];    // 已選稀有度（空陣列＝全部）
let runeSearch = "";
let runeJob = "全部";   // 職業下拉選單目前選的職業（全部＝不篩職業）

/* 首頁 */
function renderHome(){
  pageTitle.textContent = "首頁";
  view.innerHTML = `
    <div class="hero">
      <h2>歡迎來到瑪奇M 攻略資料站</h2>
      <p>這裡整理瑪奇M（台港澳版）的各項遊戲資訊。左側選單可切換不同系統，點進去即可查詢。</p>
    </div>
    <p class="sec-label">公告 · Notice</p>
    <div class="cards">
      <div class="info-card"><div class="date">2026 / 08 / 19</div><h3>網站正式上線</h3><p>符文查詢系統已建置雛形，內容陸續補充中。</p></div>
      <div class="info-card"><div class="date">建置中</div><h3>NPC 販賣清單</h3><p>下一個要製作的系統，敬請期待。</p></div>
      <div class="info-card"><div class="date">規劃中</div><h3>裝備 · 稱號</h3><p>未來將加入更多查詢系統。</p></div>
    </div>
    <p class="sec-label">快速前往 · Quick Links</p>
    <div class="quick">
      <button onclick="go('rune')">→ 符文查詢</button>
      <button onclick="go('npc')">→ NPC 販賣清單</button>
    </div>
  `;
}

/* 符文：圖案牆 */
function renderRuneGallery(){
  pageTitle.textContent = "符文查詢";
  const catItems   = ["全部", ...Object.keys(RUNE_CATEGORIES)];   // 種類按鈕清單
  const gradeItems = ["全部", ...Object.keys(GRADES)];            // 稀有度按鈕清單
  const jobItems   = ["全部", "通用", ...JOBS.map(j=>j.name)];     // 職業選單：全部＋通用＋JOBS自動帶出的18職業
  const showJob    = runeCats.includes("飾品符文");                // 有選飾品才顯示職業選單
  const jobRow = showJob ? `
      <div style="flex:0 0 100%;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">職業（飾品專屬）</div>
        <select onchange="setRuneJob(this.value)"
          style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;padding:8px 12px;border-radius:8px;outline:none;">
          ${jobItems.map(j=>`<option value="${j}" ${runeJob===j?'selected':''}>${j}</option>`).join('')}
        </select>
      </div>` : '';                                              // 沒選飾品→空字串＝整排不出現

  // 小工具：做一排按鈕。selected＝已選清單，空的就代表「全部」那顆亮
  const chipRow = (items, selected, fnName) =>
    items.map(x=>{
      const active = (x==="全部") ? selected.length===0 : selected.includes(x);   // 有沒有被選中
      return `<button class="chip ${active?'active':''}" onclick="${fnName}('${x}')">${x}</button>`;
    }).join('');

  view.innerHTML = `
    <div class="tools">
      <div class="search" style="flex:0 0 100%;"><span class="mag">⌕</span>
        <input id="runeInput" type="text" placeholder="搜尋符文名稱或效果…" value="${runeSearch}"></div>

      <div style="flex:0 0 100%;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">種類</div>
        <div class="chips">${chipRow(catItems, runeCats, 'toggleRuneCat')}</div>
      </div>

      <div style="flex:0 0 100%;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">稀有度</div>
        <div class="chips">${chipRow(gradeItems, runeGrades, 'toggleRuneGrade')}</div>
      </div>
      ${jobRow}
    </div>
    <div id="gallery"></div>`;

  const input = document.getElementById('runeInput');
  input.addEventListener('input', e=>{ runeSearch = e.target.value; drawGallery(); });
  drawGallery();
}

function drawGallery(){
  const q = runeSearch.trim();
  const gradeOrder = Object.keys(GRADES);                                       // 稀有度順序：一般→…→獨特

  // 先篩選（種類＋稀有度＋搜尋字，三個條件同時成立才留下）
  // 職業篩選：只有「有選飾品」時才生效，而且只作用在飾品符文身上
  const jobActive = runeCats.includes("飾品符文");
  const okJob = (r) => {
    if (!jobActive) return true;                       // 沒在篩飾品→職業條件不作用
    if (r.category !== "飾品符文") return true;         // 非飾品→職業不管它，一律通過
    if (runeJob === "全部") return true;                // 選全部→飾品全過
    if (runeJob === "通用") return r.job === "通用";     // 選通用→只留通用
    return r.job === runeJob;        // 選某職業→該職業＋通用一起顯示
  };

  // 先篩選（種類＋稀有度＋職業＋搜尋字，全部成立才留下）
  const filtered = RUNES.filter(r=>{
    const okCat   = runeCats.length===0   || runeCats.includes(r.category);   // 種類：沒選＝全部通過
    const okGrade = runeGrades.length===0 || runeGrades.includes(r.grade);    // 稀有度：沒選＝全部通過
    const text = r.name + r.stats + r.effect + r.gradeEffect;
    return okCat && okGrade && okJob(r) && (!q || text.includes(q));
  });

  const g = document.getElementById('gallery');
  if(filtered.length===0){ g.innerHTML = `<div class="empty">找不到符合的符文。</div>`; return; }

  // 小工具：把一顆符文做成一張卡
  const card = (r) => {
    const idx = RUNES.indexOf(r);
    const c = (GRADES[r.grade] || {}).color || "var(--muted)";
    return `<div class="rune" onclick="showRune(${idx})">
      <div class="glyph" style="color:${c};background:${c}18;">${r.glyph || r.name[0]}</div>
      <div class="rname">${r.name}</div>
      <div style="color:#f5c518;font-size:13px;margin-bottom:6px;">${r.star||0}★</div>   <!-- 外層：數字＋一顆星 -->
      <span class="badge" style="color:${c};border-color:${c};">${r.grade}</span>
    </div>`;
  };

  // 照 RUNE_CATEGORIES 的順序，一個種類一個區塊（標題＋底下卡片橫向排）
  const sections = Object.keys(RUNE_CATEGORIES).map(cat => {
    const inCat = filtered
      .filter(r => r.category === cat)                                          // 挑出這個種類的符文
      .sort((a,b)=>{
        const gd = gradeOrder.indexOf(a.grade) - gradeOrder.indexOf(b.grade);  // 先照稀有度
        if (gd !== 0) return gd;                                               // 稀有度不同→照稀有度
        return (a.star||0) - (b.star||0);                                       // 稀有度相同→再照星星，少的排前面
      });
    if (inCat.length === 0) return '';                                          // 這種類沒符文→整區不顯示
    const catName = RUNE_CATEGORIES[cat].name;
    return `<h3 style="color:var(--gold);margin:24px 0 12px;">${catName}</h3>
            <div class="gallery">${inCat.map(card).join('')}</div>`;            // 內層才用 gallery 讓卡片橫向排
  }).join('');

  g.innerHTML = sections;
}
  
/* 符文：詳情 */
function showRune(idx){
  const r = RUNES[idx];
  const g = GRADES[r.grade] || {};                                              // 這顆的稀有度資料（顏色、詛咒機率）
  const c = g.color || "var(--muted)";
  const catName = (RUNE_CATEGORIES[r.category] || {}).name || r.category;
  const curse = (r.category === "徽章符文") ? "0%" : (g.curse || "（未設定）");     // 徽章一律0%；其他照稀有度查     // 詛咒機率：從 GRADES 查
  const sourceStr = (r.source || []).join("、");        // 把多個來源用「、」串起來，例如 灰燼之塔、限定活動
  pageTitle.textContent = r.name;
  const starStr = "★".repeat(r.star||0);        // 把數字展開成整排星星，0 星就沒有
  const field = (title, value) =>                                              // 有值才顯示一個欄位，沒值自動消失
    value ? `<div class="field"><div class="k">${title}</div><div class="v">${value}</div></div>` : '';
  view.innerHTML = `
    <button class="back" onclick="renderRuneGallery()">← 返回符文列表</button>
    <div class="detail">
      <div class="big-glyph" style="color:${c};background:${c}14;">${r.glyph || r.name[0]}</div>
      <div class="info">
        <h2>${r.name}</h2>
        <div style="color:#f5c518;font-size:20px;margin:4px 0 8px;min-height:24px;">${starStr}</div>
        <span class="badge" style="color:${c};border-color:${c};">${r.grade}</span>
        <span class="badge" style="margin-left:6px;color:var(--muted);border-color:var(--line);">${catName}</span>
        ${field('數值加成 · Stats', r.stats)}
        ${field('效果 · Effect', r.effect)}
        ${field('稀有度效果 · Grade Effect', r.gradeEffect)}
        ${field('詛咒機率 · Curse', curse)}
        ${field('取得來源 · Source', sourceStr)}
      </div>
    </div>`;
}

/* 生活技能頁介紹 */
function renderLife(){
  pageTitle.textContent = " 生活技能";
  const col = (title, arr, type) => `
    <div class="col">
      <h3>${title}</h3>
      <div class="skill-list">
        ${arr.map((s,i)=>`<div class="skill-item" onclick="showSkill('${type}',${i})">${s.name}</div>`).join('')}
      </div>
    </div>`;
  view.innerHTML = `
    <div class="two-col">
      ${col('採集', GATHER, 'gather')}
      ${col('製作', CRAFT, 'craft')}
    </div>`;
}
  /* 生活技能詳細頁面 */
  /* 生活技能詳細頁面 */
  function showSkill(type, i){
    const s = (type==='gather' ? GATHER : CRAFT)[i];
    const label = type==='gather' ? '採集' : '製作';
    pageTitle.textContent = s.name;

    // 有 drops 就把每個道具做成一張「小卡」：名稱＋標籤＋簡介，可點
    let dropsHtml = '';
    if (s.drops && s.drops.length > 0) {
      const cards = s.drops.map(key => {
        const item = ITEMS[key];
        if (!item) return `<button class="item-card" disabled>（找不到道具：${key}）</button>`;
        return `<button class="item-card" onclick="showItem('${key}','${type}',${i})">
                  <div class="iname">${item.name}</div>
                  ${renderTags(item.tags)}
                  <div class="idesc">${item.desc}</div>
                </button>`;
      }).join('');
      dropsHtml = `
        <p class="sec-label">可獲得道具 · Drops</p>
        <div class="skill-list">${cards}</div>`;
    } else {
      dropsHtml = `<p class="sec-label">內容建置中</p>`;
    }

    view.innerHTML = `
      <button class="back" onclick="renderLife()">← 返回生活技能</button>
      <div class="hero"><h2>${s.name}</h2><p>分類：${label}技能<br>${s.desc||""}</p></div>
      ${dropsHtml}`;
  }

 /* 攻略專區的內容 */
    
  function renderGuide(){                                       // 攻略專區：目前兩區都先掛「維護中」
    pageTitle.textContent = "攻略專區";
  
    const wip = "🚧 維護中，內容整理中，敬請期待。";              // 之後有內容時，再換成會讀資料的卡片
  
    const section = (label) =>                                  // 一個區塊 = 小標題 + 維護中提示
      `<h3 style="color:var(--gold);margin:24px 0 12px;">${label}</h3>
       <div class="empty">${wip}</div>`;
  
    view.innerHTML = section('文章攻略') + section('影片攻略');   // 兩區疊在同一頁
  }

  
    /* 【翻譯小工具】把一串標籤代號翻成中文小藥丸。小卡和詳情頁共用這一個。
     tagKeys 例如 ["canSell","material"]，回傳已套好樣式的 HTML。 */
  function renderTags(tagKeys){
    if (!tagKeys || tagKeys.length === 0) return '';   // 沒標籤就回傳空字串
    const pills = tagKeys.map(key => {
      const t = TAGS[key];
      // 代號在 TAGS 查不到 → 用警示樣式印出代號，提醒你打錯或忘了定義
      if (!t) return `<span class="tag missing">?${key}</span>`;
      return `<span class="tag">${t.name}</span>`;
    }).join('');
    return `<div class="tags">${pills}</div>`;
  }

  /* 道具詳細頁面。fromType/fromIndex 是「從哪個技能點進來的」，讓返回鍵回到正確的技能頁 */
  function showItem(key, fromType, fromIndex){
    const item = ITEMS[key];
    if (!item) return;                       // 防呆：代號不存在就什麼都不做
    pageTitle.textContent = item.name;
    // 返回鍵要回哪裡：從 NPC 來就回 NPC，否則(技能)回技能
    const back = (fromType === 'npc')
      ? `<button class="back" onclick="showNpc(${fromIndex})">← 返回 NPC</button>`
      : `<button class="back" onclick="showSkill('${fromType}',${fromIndex})">← 返回技能</button>`;
    view.innerHTML = `
      ${back}
      <div class="hero"><h2>${item.name}</h2>${renderTags(item.tags)}</div>
      <div class="detail">
        <div class="info">
          <div class="field"><div class="k">說明 · Info</div><div class="v">${item.desc}</div></div>
        </div>
      </div>`;
  }
  
/* NPC：照地區顯示（名字＋圖片卡片） */
function renderNpc(){                                                     // NPC 列表頁：照地區排出所有 NPC 卡片
  pageTitle.textContent = "NPC 介紹";                                     // 上方標題

  const card = (npc) => {                                                 // 小工具：把一個 NPC 做成一張卡片
    const pic = npc.img                                                   // 卡片圖：有圖顯示圖，沒圖顯示佔位框
      ? `<img src="${npc.img}" alt="${npc.name}" style="width:100%;height:110px;object-fit:cover;border-radius:10px;margin-bottom:10px;">`
      : `<div style="height:110px;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--muted);font-size:13px;">無圖片</div>`;
    const idx = NPCS.indexOf(npc);                                        // 回頭問這個 NPC 在原本 NPCS 排第幾(給點擊用)
    return `<div class="rune" onclick="showNpc(${idx})">${pic}<div class="rname">${npc.name}</div></div>`;  // 卡片可點→進詳細頁
  };

  const sections = REGIONS.map(region => {                                // 照 REGIONS 順序，一個地區一個地區處理
    const list = NPCS.filter(npc => npc.region === region);              // 篩出屬於這個地區的 NPC
    const cards = list.length                                            // 這地區有 NPC 才排卡片，沒有就顯示提示
      ? `<div class="gallery">${list.map(card).join('')}</div>`
      : `<div class="empty">這個地區還沒有 NPC。</div>`;
    return `<h3 style="color:var(--gold);margin:24px 0 12px;">${region}</h3>${cards}`;  // 地區標題 + 底下的卡片
  }).join('');

  view.innerHTML = sections;                                             // 把整包塞進畫面
}
/* NPC：詳細頁（介紹＋所在地＋販賣清單） */
function showNpc(idx){                                                    // idx = 這個 NPC 在 NPCS 裡排第幾
  const npc = NPCS[idx];                                                  // 用編號撈出被點的那個 NPC
  pageTitle.textContent = npc.name;                                       // 上方標題改成 NPC 名字

  const pic = npc.img                                                     // 頭像：有圖顯示圖，沒圖顯示佔位框
    ? `<img src="${npc.img}" alt="${npc.name}" style="width:160px;height:160px;object-fit:cover;border-radius:14px;">`
    : `<div style="width:160px;height:160px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--muted);">無圖片</div>`;

  const shopTable = (list) => {                                           // 小工具1：把一份清單變成一行行表格
    if (!list || !list.length) return '';                                // 沒這種清單就回空字串
    return list.map(s => {                                                // 逐筆處理
      const it = ITEMS[s.item];                                           // 用代號去 ITEMS 查
      const name = it                                                     // 查得到→可點連結；查不到→純文字
        ? `<span onclick="showItem('${s.item}','npc',${idx})" style="color:var(--gold);cursor:pointer;text-decoration:underline;">${it.name}</span>`
        : s.item;
      return `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);">
                <span>${name}</span>
                <span style="color:var(--muted);">${s.price} ${s.currency}</span>
              </div>`;
    }).join('');
  };

  const section = (title, list) => {                                      // 小工具2：做一個清單區塊(標題+表格)
    if (!list || !list.length) return '';                                // 沒東西→這區不出現(自動消失)
    return `<div class="field"><div class="k">${title}</div><div class="v">${shopTable(list)}</div></div>`;
  };

  view.innerHTML = `
    <button class="back" onclick="renderNpc()">← 返回 NPC 列表</button>
    <div class="detail">
      ${pic}
      <div class="info">
        <h2>${npc.name}</h2>
        <div class="field"><div class="k">所在地 · Region</div><div class="v">${npc.region}</div></div>
        <div class="field"><div class="k">介紹 · Info</div><div class="v">${npc.desc || "（尚未填寫）"}</div></div>
        ${section('販賣 · Shop',      npc.sells)}
        ${section('以物易物 · Barter', npc.barter)}
        ${section('活動限定 · Event',  npc.event)}
      </div>
    </div>
  `;
}
// 想加新清單(如戰鬥需求)：上面 view 裡多一行 ${section('戰鬥 · Fight', npc.fight)}，再到 NPC 資料加 fight 欄位(兩邊名字要一致)
  
/* 職業：第一層，照分類排出職業卡片 */
function renderJobs(){
  pageTitle.textContent = "職業介紹";

  const card = (job) => {
    const idx = JOBS.indexOf(job);
    return `<div class="rune" onclick="showJob(${idx})"><div class="rname">${job.name}</div></div>`;
  };

  const sections = CATEGORIES.map(cat => {
    const list = JOBS.filter(job => job.category === cat);
    const cards = list.length
      ? `<div class="gallery">${list.map(card).join('')}</div>`
      : `<div class="empty">這個分類還沒有職業。</div>`;
    return `<h3 style="color:var(--gold);margin:24px 0 12px;">${cat}</h3>${cards}`;
  }).join('');

  view.innerHTML = sections;
}
 
  /* 職業：第二層，職業詳情頁（介紹 + 主動/被動技能）*/
function showJob(idx){
  const job = JOBS[idx];
  pageTitle.textContent = job.name;

  /* 職業：第三層，單一技能詳情（基礎說明 + 符文變體）*/
function showJobSkill(jobIdx, skillIdx){
  const job = JOBS[jobIdx];
  const skill = job.skills[skillIdx];
  pageTitle.textContent = skill.name;

  const typeLabel = skill.type === 'active' ? '主動技能' : '被動技能';

  // 符文變體：有才顯示，一個變體一行「符文 → 效果」
  let variantHtml = '';
  if (skill.variants && skill.variants.length > 0) {
    const rows = skill.variants.map(v => `
      <div style="padding:10px 0;border-bottom:1px solid var(--line);">
        <span style="color:var(--gold);">${v.rune}</span>
        <span style="color:var(--muted);"> → </span>
        <span>${v.effect || "（效果尚未填寫）"}</span>
      </div>`).join('');
    variantHtml = `
      <p class="sec-label">符文變體 · Rune Variants</p>
      <div class="skill-list">${rows}</div>`;
  }

  view.innerHTML = `
    <button class="back" onclick="showJob(${jobIdx})">← 返回 ${job.name}</button>
    <div class="hero"><h2>${skill.name}</h2><p>分類：${typeLabel}<br>${skill.desc || "（說明尚未填寫）"}</p></div>
    ${variantHtml}`;
}

  // 小工具：做一欄技能（標題 + 該類技能的可點卡片）
  const col = (title, type) => {
    const list = (job.skills || []).filter(s => s.type === type);   // 篩出主動或被動
    const cards = list.length
      ? list.map(s => {
          const sIdx = job.skills.indexOf(s);   // 它在 job.skills 的真實編號，給第三層用
          return `<div class="item-card" onclick="showJobSkill(${idx},${sIdx})">
                    <div class="iname">${s.name}</div>
                    ${s.desc ? `<div class="idesc">${s.desc}</div>` : ''}
                  </div>`;
        }).join('')
      : `<div class="empty">尚未建置。</div>`;
    return `<div class="col"><h3>${title}</h3><div class="skill-list">${cards}</div></div>`;
  };

  view.innerHTML = `
    <button class="back" onclick="renderJobs()">← 返回職業列表</button>
    <div class="hero"><h2>${job.name}</h2><p>${job.desc || "（職業介紹尚未填寫）"}</p></div>
    <div class="two-col">
      ${col('主動技能', 'active')}
      ${col('被動技能', 'passive')}
    </div>`;
}

  
/* 切換畫面 */
function go(v){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  if(v==='home') renderHome();
  else if(v==='rune'){ runeCats=[]; runeGrades=[]; runeSearch=""; runeJob="全部"; renderRuneGallery(); }
  else if(v==='npc') renderNpc();
  else if(v==='life') renderLife();
  else if(v==='job') renderJobs();
  else if(v==='guide') renderGuide();
  closeMenu();
}
// 切換種類：已選→取消、未選→加入；按「全部」→ 清空（＝顯示全部）
function toggleRuneCat(x){
  if(x==="全部"){ runeCats=[]; }
  else if(runeCats.includes(x)){ runeCats = runeCats.filter(v=>v!==x); }   // 已在清單→移除
  else { runeCats.push(x); }                                              // 不在→加入
  renderRuneGallery();
}
// 稀有度同理
function toggleRuneGrade(x){
  if(x==="全部"){ runeGrades=[]; }
  else if(runeGrades.includes(x)){ runeGrades = runeGrades.filter(v=>v!==x); }
  else { runeGrades.push(x); }
  renderRuneGallery();
}
// 職業下拉選單：選了就記起來、重畫
function setRuneJob(v){ runeJob = v; renderRuneGallery(); }

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn'); if(btn) go(btn.dataset.view);
});

/* 手機選單 */
const sidebar=document.getElementById('sidebar'), backdrop=document.getElementById('backdrop');
function openMenu(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
function closeMenu(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
document.getElementById('menuToggle').addEventListener('click', openMenu);
backdrop.addEventListener('click', closeMenu);

renderHome();
</script>
